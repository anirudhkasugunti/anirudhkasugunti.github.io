<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer canvas background -->
  <rect width="500" height="500" fill="#ffffff"/>

  <!-- Encircling O -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="#E63946" stroke-width="34"/>

  <!-- Letters placed in 4 quadrants, cyclic order from top-left: B, I, N, G -->
  <!-- Each letter sits on its own colored background circle -->

  <!-- B - Top Left -->
  <circle cx="160" cy="190" r="80" fill="#1D3557"/>
  <text x="160" y="192" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="900"
        fill="#ffffff" text-anchor="middle" dominant-baseline="middle">B</text>

  <!-- I - Top Right -->
  <circle cx="340" cy="190" r="80" fill="#2A9D8F"/>
  <text x="340" y="192" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="900"
        fill="#ffffff" text-anchor="middle" dominant-baseline="middle">I</text>

  <!-- N - Bottom Right -->
  <circle cx="340" cy="330" r="80" fill="#F4A261"/>
  <text x="340" y="332" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="900"
        fill="#ffffff" text-anchor="middle" dominant-baseline="middle">N</text>

  <!-- G - Bottom Left -->
  <circle cx="160" cy="330" r="80" fill="#8338EC"/>
  <text x="160" y="332" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="900"
        fill="#ffffff" text-anchor="middle" dominant-baseline="middle">G</text>
</svg>
